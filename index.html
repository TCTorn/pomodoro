<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <h1>Pomodoro</h1>
    <p id="phase" role="status" aria-live="polite">Focus</p>
    <p id="notice" role="status" aria-live="polite" hidden></p>
    <div class="dial">
      <svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">
        <circle class="ring-track" cx="50" cy="50" r="45"></circle>
        <circle id="ring" class="ring-progress" cx="50" cy="50" r="45"
                pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"></circle>
      </svg>
      <div id="timer" role="timer" aria-live="off">25:00</div>
    </div>

    <div class="controls">
      <button id="start" type="button">Start</button>
      <button id="pause" type="button">Pause</button>
      <button id="reset" type="button">Reset</button>
    </div>

    <form id="settings" novalidate>
      <label>Focus (min)
        <input id="focus-minutes" type="text" inputmode="numeric" autocomplete="off">
      </label>
      <label>Short break (min)
        <input id="short-minutes" type="text" inputmode="numeric" autocomplete="off">
      </label>
      <label>Long break (min)
        <input id="long-minutes" type="text" inputmode="numeric" autocomplete="off">
      </label>
      <p id="error" role="alert"></p>
    </form>

    <section class="notes">
      <label for="notes-text">Notes</label>
      <textarea id="notes-text" rows="4" autocomplete="off"
                placeholder="Park an idea here"></textarea>
      <p id="notes-warning" role="status" hidden></p>
      <button id="notes-download" type="button">Download notes</button>
    </section>
  </main>
  <script type="module" src="./ui.js"></script>
</body>
</html>
