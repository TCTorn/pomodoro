<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <h1>Pomodoro</h1>
    <p id="phase" role="status" aria-live="polite">Focus</p>
    <div id="timer" role="timer" aria-live="off">25:00</div>

    <div class="controls">
      <button id="start" type="button">Start</button>
      <button id="pause" type="button">Pause</button>
      <button id="reset" type="button">Reset</button>
    </div>

    <form id="settings" novalidate>
      <label>Focus (min)
        <input id="focus-minutes" type="text" inputmode="numeric" autocomplete="off">
      </label>
      <label>Short break (min)
        <input id="short-minutes" type="text" inputmode="numeric" autocomplete="off">
      </label>
      <label>Long break (min)
        <input id="long-minutes" type="text" inputmode="numeric" autocomplete="off">
      </label>
      <p id="error" role="alert"></p>
    </form>
  </main>
  <script type="module" src="./ui.js"></script>
</body>
</html>
